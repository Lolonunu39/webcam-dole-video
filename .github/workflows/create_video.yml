name: Create Webcam Video

on:
  schedule:
    # S'exécute à 23h05 heure française (21h05 UTC en été, 22h05 UTC en hiver)
    - cron: "5 22 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run script
        env:
          FTP_HOST: "ftpupload.net"
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 create_video.py
